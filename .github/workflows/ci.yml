name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: narriflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d narriflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKFLOW_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/narriflow_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Frozen install
        run: bun ci

      - name: Biome
        run: bun run lint:biome

      - name: Typecheck
        run: bun run typecheck

      - name: Workflow concurrency integration tests
        run: bun run test:workflow:db

      - name: Test
        run: bun run test

      - name: Production dependency audit
        run: bun run audit:production

      - name: Production build
        run: bun run build
