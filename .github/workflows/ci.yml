name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Frozen install
        run: bun ci

      - name: Biome
        run: bun run lint:biome

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Production dependency audit
        run: bun run audit:production

      - name: Production build
        run: bun run build
