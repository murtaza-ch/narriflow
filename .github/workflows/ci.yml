name: CI

on:
  push:
  pull_request:

jobs:
  native-media:
    name: Pinned Linux media runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the pinned render image from tracked files
        shell: bash
        run: |
          set -euo pipefail
          media_context="$(mktemp -d)"
          trap 'rm -rf -- "$media_context"' EXIT
          git archive HEAD | tar -x -C "$media_context"
          cp "$media_context/apps/media/images/render.dockerignore" "$media_context/.dockerignore"
          docker build --platform linux/amd64 \
            --file "$media_context/apps/media/images/Dockerfile" \
            --build-arg MEDIA_PROFILE=render --build-arg MEDIA_THREADS=4 \
            --tag narriflow-media:native-ci "$media_context"

      - name: Run native and fault tests without external network or credentials
        shell: bash
        run: |
          set -euo pipefail
          media_cpuset="$(python3 -c 'import os; cpus=sorted(os.sched_getaffinity(0)); assert len(cpus)>=4; print(",".join(map(str,cpus[:4])))')"
          docker run --rm --init --platform linux/amd64 \
            --network none --cpus 4 --cpuset-cpus "$media_cpuset" \
            --memory 8g --memory-swap 8g --workdir /app \
            --env PYTHONPATH=/app/apps/media/python:/app \
            narriflow-media:native-ci \
            python -m unittest discover -s apps/media/python/tests -p 'test_*.py'

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Frozen install
        run: bun ci

      - name: Biome
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: API route inventory
        run: bun run --cwd apps/api test:inventory

      - name: Public OpenAPI artifact matches the REST routes
        run: bun run --cwd apps/api openapi:check

      - name: MCP wire and workflow acceptance
        run: bun run test:mcp:integration

      - name: Production dependency audit
        run: bun run audit:production

      # The browser reads the API origin at build time. CI builds against the local default.
      - name: Production build
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Web is a client of the API (imports, Server Actions, route handlers, client bundle)
        run: bun scripts/check-web-backend-imports.ts --bundle

  # integrations/zapier is its own npm project, so the Bun jobs above never run it.
  zapier:
    name: Zapier app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/zapier
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: integrations/zapier/package-lock.json

      - name: Frozen install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate (offline)
        run: npm run validate

  # integrations/make is plain JSON for Make to interpret: no install, no build.
  make:
    name: Make app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Test
        run: node --test "integrations/make/test/*.test.mjs"

  postgres-invariants:
    name: PostgreSQL / ${{ matrix.domain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: Workflow Run
            command: test:workflow:db
          - domain: Upload Session
            command: test:upload-session:db
          - domain: Processing Usage
            command: test:processing-usage:db
          - domain: Workspace Billing
            command: test:workspace-billing:db
          - domain: Social Publication Attempt
            command: test:social-publication:db
          - domain: Clip Editor Document Persistence
            command: test:clip-editor-persistence:db
          - domain: Authenticated Request Policy
            command: test:authenticated-request-policy:db
          - domain: Brand Profiles
            command: test:brand-profiles:db
          - domain: Vizard Expansion
            command: test:vizard-expansion:db
          - domain: Integration API receipts, callbacks, and Tasks
            command: test:integration-api:db
          - domain: Library Search
            command: test:library-search:db
          - domain: Serverless Execution
            command: test:execution:db
    services:
      postgres:
        # pgvector for the library search migration; otherwise stock PostgreSQL 17.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: narriflow_serverless_gates_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d narriflow_serverless_gates_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/narriflow_serverless_gates_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/narriflow_serverless_gates_ci
      SERVERLESS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/narriflow_serverless_gates_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Frozen install
        run: bun ci

      - name: Run ${{ matrix.domain }} invariants
        run: bun run ${{ matrix.command }}
